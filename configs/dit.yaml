# ============================================================
# Model
# ============================================================

model:

  name: dit

  variant: DiT-XL


  dit:

    latent_dim: 4

    mlp_ratio: 4.0

    grid_h: 8

    grid_w: 8


    num_classes: null

    cfg_dropout: 0.1

    dropout: 0.1


  attention:

    # mha | rope
    type: rope



# ============================================================
# VAE dependency
# ============================================================

vae:

  checkpoint: checkpoints/vae_final.pt



# ============================================================
# Diffusion
# ============================================================

diffusion:

  schedule: cosine

  timestep: 1000

  beta_start: 1.0e-4

  beta_end: 0.02

  cosine_s: 0.008


  sampler: ddim

  learn_sigma: true