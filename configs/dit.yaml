model:

  name: dit

  variant: DiT-XL


  dit:

    latent_dim: 4

    mlp_ratio: 4.0

    grid_h: 8
    grid_w: 8

    num_classes: null

    cfg_dropout: 0.0

    dropout: 0.1


  attention:

    type: rope



vae:

  checkpoint: checkpoints/vae_final.pt



diffusion:

  schedule: cosine

  timestep: 1000

  beta_start: 1.0e-4

  beta_end: 0.02

  cosine_s: 0.008

  learn_sigma: false



loss:

  diffusion: mse