model:

  name: dit

  variant: DiT-S


  dit:

    latent_dim: 4

    mlp_ratio: 4.0

    grid_h: 8
    grid_w: 8

    num_classes: null

    cfg_dropout: 0.0

    dropout: 0.0


  attention:

    type: rope



vae:

  checkpoint: checkpoints/vae_final.pt

# ============================================================
# Evaluation
# ============================================================

eval:

  every: 1000

  fid:
    enabled: true
    fid_num_samples: 1000
    sample_batch_size: 64
    ddim_steps: 50
    guidance_scale: 1.0
    eta: 0.0

diffusion:

  schedule: cosine

  timestep: 200

  beta_start: 1.0e-4

  beta_end: 0.02

  cosine_s: 0.008

  learn_sigma: false



loss:

  diffusion: mse
train:

  resume: checkpoints/dit_60000.pt