model:

  name: dit

  variant: DiT-S


  dit:

    latent_dim: 4

    mlp_ratio: 4.0

    grid_h: 8
    grid_w: 8

    num_classes: 10

    cfg_dropout: 0.0

    dropout: 0.0


  attention:

    type: rope



vae:

  checkpoint: /kaggle/input/datasets/zanteniwajdi/elt-vae-100000-checkpoint/vae_100000.pt
elt:
  enabled: false
# ============================================================
# Evaluation
# ============================================================

eval:

  every: 1000

  fid:
    enabled: true
    fid_num_samples: 1000
    sample_batch_size: 64
    ddim_steps: 50
    guidance_scale: 1.0
    eta: 0.0

diffusion:

  schedule: cosine

  timestep: 1000

  beta_start: 1.0e-4

  beta_end: 0.02

  cosine_s: 0.008

  learn_sigma: false

sampling:
  checkpoint: null
  save_dir: samples

  enabled: true

  every: 5000

  diffusion:
    num_images: 16
    batch_size: 16
    sampler: ddim
    num_steps: 50
    guidance_scale: 1.0
    eta: 0.0

loss:

  diffusion: mse
train:

  resume: null

conditioning:
  enabled: false