seed: 42


# ============================================================
# Data
# ============================================================

data:
  root: ./data/celeba_hq
  dataset: imagefolder
  
  image_size: 256

  batch_size: 8

  num_workers: 8



# ============================================================
# Optimizer
# ============================================================

optimizer:

  name: adamw

  lr: 1.0e-5

  weight_decay: 0.01

  betas:
    - 0.9
    - 0.999

  eps: 1.0e-8

  fused: true



# ============================================================
# Scheduler
# ============================================================

scheduler:
  name: linear_warmup_constant
  warmup_ratio: 0.1


# ============================================================
# Training
# ============================================================

train:

  total_steps: 200000
  ema_window_ratio: 0.1

  mixed_precision: bf16

  use_compile: true

  benchmark: true

  allow_tf32: true

  grad_clip_norm: 1.0

  log_every: 100

  ckpt_every: 5000

  checkpoints_dir: checkpoints
  deterministic: false

repa:
  enabled: false
  lambda: 0.5
  repr_dim: 512
  encoder: dinov2