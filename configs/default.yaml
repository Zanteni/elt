seed: 42


# ============================================================
# Data
# ============================================================

data:

  root: /kaggle/input/datasets/ayush1220/cifar10/cifar10

  dataset: imagefolder

  image_size: 32

  batch_size: 256

  num_workers: 4



# ============================================================
# Optimizer
# ============================================================

optimizer:

  name: adamw

  lr: 1.0e-4

  weight_decay: 0.0

  betas:
    - 0.9
    - 0.999

  eps: 1.0e-8

  fused: true



# ============================================================
# Scheduler
# ============================================================

scheduler:

  name: linear_warmup_cosine

  warmup_steps: 5000

  min_lr_ratio: 1e-7



# ============================================================
# Training
# ============================================================

train:

  total_steps: 200000

  mixed_precision: bf16

  use_compile: true

  benchmark: true

  allow_tf32: true

  grad_clip_norm: 1.0

  log_every: 100

  ckpt_every: 5000

  checkpoints_dir: checkpoints

  ema_decay: 0.9999

  deterministic: false

repa:
  enabled: true
  lambda: 0.5
  repr_dim: 512
  encoder: dinov2