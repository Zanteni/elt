seed: 42


# ============================================================
# Data
# ============================================================

data:

  root: ./data

  dataset: cifar10

  image_size: 32

  batch_size: 128

  num_workers: 4



# ============================================================
# Optimizer
# ============================================================

optimizer:

  name: adamw

  lr: 3.0e-4

  weight_decay: 0.0

  betas:
    - 0.9
    - 0.999

  eps: 1.0e-8

  fused: true



# ============================================================
# Scheduler
# ============================================================

scheduler:

  name: linear_warmup_cosine

  warmup_steps: 5000

  min_lr_ratio: 0.0



# ============================================================
# Training
# ============================================================

train:

  total_steps: 100000

  mixed_precision: bf16

  use_compile: true

  benchmark: true

  allow_tf32: true

  grad_clip_norm: 1.0

  log_every: 100

  ckpt_every: 5000

  checkpoints_dir: checkpoints

  ema_decay: 0.9999

  deterministic: false